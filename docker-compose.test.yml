# -------------------------------------------------------------------------------
# Test Cluster - A Nomad Fleet To Drive The Tool Against By Hand
#
# Author: Alex Freidah
#
# Three servers and two clients. The shape matters:
#
#   three servers  tolerance of one, which the server gate requires before it
#                  will let a run touch a coordinating host, and somewhere for
#                  coordination to go when the primary hands it over. A single
#                  server can satisfy neither.
#   two clients    more than one host to roll, so the client stage is a
#                  sequence rather than a single step.
#
# The fleet starts on FROM_VERSION, which is deliberately behind the version
# you plan toward -- a cluster already at the target plans a run whose every
# task is a no-op, which looks like work and does none.
#
#   make cluster-up                      start it on the default older version
#   FROM_VERSION=2.0.4 make cluster-up   start it further back
#   make cluster-down                    stop it and discard its state
#
# The integration tests do not use this; they start their own containers
# through testcontainers. Nothing here has to be running for them to pass.
#
# The names and the count are this file's own. No part of the real fleet
# belongs in this repository, and nothing here is read by the tool: topology is
# discovered from the API at runtime.
# -------------------------------------------------------------------------------

x-agent: &agent
  # Nomad's client half enables controllers by writing cgroup.subtree_control
  # on the cgroup root, and cgroup v2 refuses that on any cgroup holding
  # processes directly. The container's PID 1 sits in that root, so the write
  # fails with "device or resource busy" until it is moved into a child.
  #
  # This is why the image warns that running clients in a container is
  # unsupported. It is fine for a test fleet, which needs registered nodes
  # rather than a working task runner.
  image: hashicorp/nomad:${FROM_VERSION:-2.0.5}
  entrypoint: ["/bin/sh", "-c"]
  privileged: true
  cgroup: private
  networks: [nomad]

x-server: &server
  <<: *agent
  command:
    - >-
      mkdir -p /sys/fs/cgroup/init &&
      echo 1 > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null;
      exec nomad agent -server -bootstrap-expect=3
      -bind=0.0.0.0 -data-dir=/tmp/nomad
      -retry-join=nomad-server-1
      -retry-join=nomad-server-2
      -retry-join=nomad-server-3

x-client: &client
  <<: *agent
  command:
    - >-
      mkdir -p /sys/fs/cgroup/init &&
      echo 1 > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null;
      exec nomad agent -client -bind=0.0.0.0 -data-dir=/tmp/nomad
      -servers=nomad-server-1:4647,nomad-server-2:4647,nomad-server-3:4647
  volumes:
    # The docker task driver talks to the host daemon. Nothing the tool does
    # needs it; it is here so a hand-run fleet can actually place work.
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    nomad-server-1:
      condition: service_healthy

services:
  # The only agent publishing a port. A run reads the cluster through a server,
  # and any of the three would do; exposing one keeps NOMAD_ADDR fixed.
  nomad-server-1:
    <<: *server
    container_name: nomad-test-server-1
    ports:
      - "4646:4646"
    healthcheck:
      # Answers only once the three have elected a leader, which is what
      # `up --wait` should block on: a run against a cluster mid-election
      # fails for reasons that have nothing to do with the tool.
      test: ["CMD", "nomad", "operator", "api", "/v1/status/leader"]
      interval: 2s
      timeout: 2s
      retries: 45

  nomad-server-2:
    <<: *server
    container_name: nomad-test-server-2

  nomad-server-3:
    <<: *server
    container_name: nomad-test-server-3

  nomad-client-1:
    <<: *client
    container_name: nomad-test-client-1

  nomad-client-2:
    <<: *client
    container_name: nomad-test-client-2

networks:
  nomad:
    driver: bridge
