<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">What a run does when it stops</title>
  <desc id="desc">Each task settles as succeeded or unnecessary, or does not settle at all. A resumed run starts at the first task that has not settled. Failed means the task reported an error; active means it started and never reported back, which is what an interrupt leaves behind. Neither is stepped over, because whether the work took effect is exactly what is unknown. The status command says which task and why, and run with the reset flag forgets that task's record so the run reaches it again once an operator has looked at the host.</desc>
  <defs>
    <style>
      .t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .label{font-size:19px;font-weight:700;fill:#f8fafc}
      .small{font-size:14px;font-weight:600;fill:#c9ccd3}
      .micro{font-size:14px;font-weight:700;fill:#ff8340;letter-spacing:.08em}
      .line{fill:none;stroke:#fc6718;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .card{fill:#15171c;stroke:#fc6718;stroke-width:2}
      .quiet{fill:#15171c;stroke:#9a9ea6;stroke-width:2}
      .stop{fill:#1d1410;stroke:#ff8340;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#fc6718"/></marker>
  </defs>
  <g class="t">

    <text x="40" y="36" class="micro">SETTLED -A RESUMED RUN MOVES PAST THESE</text>
    <rect x="40" y="56" width="215" height="78" rx="20" class="card"/>
    <rect x="283" y="56" width="215" height="78" rx="20" class="card"/>
    <g text-anchor="middle">
      <text x="147" y="92" class="label">succeeded</text><text x="147" y="116" class="small">done</text>
      <text x="390" y="92" class="label">unnecessary</text><text x="390" y="116" class="small">already at the target</text>
    </g>
    <rect x="40" y="150" width="458" height="42" rx="14" class="quiet"/>
    <text x="269" y="177" text-anchor="middle" class="small">waiting -- not reached, so there is nothing to decide about</text>

    <text x="620" y="36" class="micro">NOT SETTLED -A RESUMED RUN STOPS HERE</text>
    <rect x="620" y="56" width="245" height="78" rx="20" class="stop"/>
    <rect x="895" y="56" width="245" height="78" rx="20" class="stop"/>
    <g text-anchor="middle">
      <text x="742" y="92" class="label">failed</text><text x="742" y="116" class="small">reported an error</text>
      <text x="1017" y="92" class="label">active</text><text x="1017" y="116" class="small">never reported back</text>
    </g>
    <text x="880" y="177" text-anchor="middle" class="small">whether the work took effect is exactly what is unknown</text>

    <!-- Both not-settled outcomes lead to the same recovery, in one path. -->
    <path class="line" d="M1017 134V206H742"/>
    <path class="line" marker-end="url(#arrow)" d="M742 134V206H165V258"/>

    <text x="40" y="246" class="micro">RECOVERY -AN OPERATOR NAMES THE TASK</text>
    <rect x="40" y="266" width="250" height="86" rx="20" class="card"/>
    <rect x="350" y="266" width="280" height="86" rx="20" class="card"/>
    <rect x="690" y="266" width="280" height="86" rx="20" class="card"/>
    <path class="line" marker-end="url(#arrow)" d="M290 309H350"/>
    <path class="line" marker-end="url(#arrow)" d="M630 309H690"/>
    <g text-anchor="middle">
      <text x="165" y="304" class="label">status</text><text x="165" y="330" class="small">which task, and why</text>
      <text x="490" y="304" class="label">look at the host</text><text x="490" y="330" class="small">outside the tool</text>
      <text x="830" y="304" class="label">run --reset</text><text x="830" y="330" class="small">that task runs again</text>
    </g>

    <text x="40" y="392" class="small">A half-done converge is not assumed safe to repeat. The operator naming it is the difference between a retry and a guess.</text>
  </g>
</svg>
